appId: app.muukii.brightroom.SwiftUIDemo
name: Metal Brush Sandbox
tags:
  - metal-brush-sandbox
---
- launchApp:
    clearState: false
    stopApp: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    id: "BackButton"
    optional: true
- tapOn: "Metal Brush Sandbox"
- assertVisible: "Metal Brush Sandbox"
- assertVisible:
    id: "metal-brush-dirty-toggle"
- assertVisible:
    id: "metal-brush-viewport-toggle"
- assertVisible:
    id: "metal-brush-reset"
- assertVisible:
    id: "metal-brush-metrics"
- assertVisible:
    id: "metal-brush-smoothing"
- assertVisible:
    id: "metal-brush-smoothing-strength"
- tapOn:
    id: "metal-brush-reset"
- assertVisible: "Stamps 0"
- assertVisible: "Tile 256"
- assertVisible: "View .*%"
- assertVisible: "Bezier"
- assertVisible: "Strength"
- tapOn: "Raw"
- tapOn: "Catmull"
- tapOn: "Avg"
- tapOn: "Bezier"
- assertVisible: "Size"
- assertVisible: "Hardness"
- assertVisible: "56.00"
- assertVisible: "0.72"
- swipe:
    start: 42%, 78%
    end: 63%, 78%
    duration: 400
- assertNotVisible: "56.00"
- swipe:
    start: 57%, 83%
    end: 37%, 83%
    duration: 400
- assertNotVisible: "0.72"
- swipe:
    start: 48%, 32%
    end: 52%, 47%
    duration: 500
- assertVisible: "Stamps [1-9].*"
- swipe:
    start: 62%, 35%
    end: 48%, 51%
    duration: 500
- assertVisible: "Tiles [1-9].*"
- tapOn:
    id: "metal-brush-reset"
- assertVisible: "Stamps 0"
- tapOn:
    id: "metal-brush-dirty-toggle"
- tapOn:
    id: "metal-brush-dirty-toggle"
