name: Lightweight runtime resource audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lightroom-replay.yml'
      - 'Tools/LightroomComparison/**'
      - 'Sources/BrightroomParametric/**'
      - 'Sources/BrightroomColorAdjustmentKernels/**'
      - 'Plugins/BuildColorAdjustmentKernels/**'
      - 'Dev/**'
      - 'Package.swift'

permissions:
  contents: read

jobs:
  charts:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.5"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record worker and check Metal
        run: |
          sw_vers
          xcodebuild -version
          xcrun -f metal
          xcrun swift -e 'import Metal; guard let gpu = MTLCreateSystemDefaultDevice() else { fatalError("No Metal device") }; print(gpu.name)'
      - name: Build Brightroom without optional grading models
        run: |
          xcodebuild -project Dev/Brightroom.xcodeproj -scheme SwiftUIDemo \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .tmp/resource-audit \
            -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
          python3 - <<'PY'
          from pathlib import Path
          app = Path('.tmp/resource-audit/Build/Products/Debug-iphonesimulator/SwiftUIDemo.app')
          assert app.is_dir(), 'Missing built application'
          models = {'ColorMixerCalibration.lzfse', 'StrongWhitesCalibration.lzfse',
            'TonalPointCalibration.lzfse', 'SaturationCalibration.lzfse',
            'ColorGradingCalibration.bin', 'HighlightStrength.bin', 'HighlightShadowCalibration.json'}
          forbidden = [str(p) for p in app.rglob('*')
            if p.name in models or 'BrightroomGradingKit' in str(p)]
          assert not forbidden, forbidden
          for bundle in app.rglob('Brightroom*.bundle'):
            size = sum(p.stat().st_size for p in bundle.rglob('*') if p.is_file())
            print(bundle.name, size, 'bytes')
          print('No calibrated model or GradingKit resource in the standard application')
          PY
